<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Application reference</title>
<meta name="description" content="What this application is and what happens when work enters it. Generated from the definition the runtime executes.">
<style>
  /* Served by the runtime itself, offline: no external fonts, scripts or styles. */
  :root {
    color-scheme: light dark;
    --bg: #eef0f3; --surface: #ffffff; --raised: #f7f8fa; --ink: #171a20; --muted: #5a6270; --line: #dde1e7; --line-strong: #c3c9d2;
    --code-bg: #f3f4f7; --focus: #171a20; --shadow: 0 12px 32px rgba(23, 26, 32, 0.14);
    --get: #1f4fc4; --post: #1a7439; --put: #8f5400; --patch: #8f5400; --delete: #b02121; --other: #5a6270;
    --boundary: #5b3fbf; --world: #0c7472; --lease: #35479a; --handoff: #a84c08; --publish: #8a2a6c;
    --ok: #1a7439; --bad: #b02121; --warn: #8f5400;
    --nav-w: 272px; --panel-w: 380px; --measure: 76ch; --radius: 6px;
    --text-xs: 0.8125rem; --text-sm: 0.875rem; --text-base: 0.9375rem; --text-lg: 1.125rem; --text-xl: 1.375rem; --text-2xl: 1.875rem;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15181d; --surface: #1c2027; --raised: #222730; --ink: #e6e8ec; --muted: #98a1ad; --line: #2b313b; --line-strong: #3d4552;
      --code-bg: #12151a; --focus: #e6e8ec; --shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
      --get: #86a8ff; --post: #72d093; --put: #e6ad62; --patch: #e6ad62; --delete: #ff8f8f; --other: #98a1ad;
      --boundary: #bba9ff; --world: #62d6d1; --lease: #a9b7ff; --handoff: #ffb27a; --publish: #f095d3;
      --ok: #72d093; --bad: #ff8f8f; --warn: #e6ad62;
    }
  }
  :root[data-theme="dark"] {
    --bg: #15181d; --surface: #1c2027; --raised: #222730; --ink: #e6e8ec; --muted: #98a1ad; --line: #2b313b; --line-strong: #3d4552;
    --code-bg: #12151a; --focus: #e6e8ec; --shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
    --get: #86a8ff; --post: #72d093; --put: #e6ad62; --patch: #e6ad62; --delete: #ff8f8f; --other: #98a1ad;
    --boundary: #bba9ff; --world: #62d6d1; --lease: #a9b7ff; --handoff: #ffb27a; --publish: #f095d3;
    --ok: #72d093; --bad: #ff8f8f; --warn: #e6ad62;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { scroll-padding-top: 16px; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: var(--text-base)/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  }
  code, pre, kbd, .mono { font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace; font-size: 0.92em; }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 3px; }
  button { font: inherit; color: inherit; }
  h1, h2, h3, h4 { margin: 0; font-weight: 600; letter-spacing: -0.01em; }
  p { margin: 0; }
  [hidden] { display: none !important; }
  .skip { position: absolute; left: -999px; top: 8px; background: var(--surface); padding: 8px 12px; border: 1px solid var(--line-strong); z-index: 40; }
  .skip:focus { left: 8px; }
  .vh { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ---- shell --------------------------------------------------------------- */
  .shell { display: grid; grid-template-columns: var(--nav-w) minmax(0, 1fr); min-height: 100vh; }
  .topbar { display: none; }
  .nav { position: sticky; top: 0; height: 100vh; overflow: auto; border-right: 1px solid var(--line); background: var(--surface); padding: 16px 12px 40px; min-width: 0; }
  .doc { min-width: 0; padding: 40px clamp(16px, 4vw, 56px) 120px; }
  .doc > * { max-width: calc(var(--measure) + 120px); }
  .panel { position: fixed; inset: 0 0 0 auto; width: min(var(--panel-w), 100vw); background: var(--surface); border-left: 1px solid var(--line); overflow: auto; transform: translateX(100%); visibility: hidden; z-index: 30; padding: 16px 16px 40px; box-shadow: var(--shadow); }
  .panel.open { transform: none; visibility: visible; }
  .backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.35); z-index: 20; }
  @media (prefers-reduced-motion: no-preference) { .panel { transition: transform 200ms ease, visibility 200ms; } }
  @media (min-width: 1280px) {
    .shell { grid-template-columns: var(--nav-w) minmax(0, 1fr) var(--panel-w); }
    .shell.no-panel { grid-template-columns: var(--nav-w) minmax(0, 1fr); }
    .panel { position: sticky; top: 0; height: 100vh; transform: none; visibility: visible; box-shadow: none; width: auto; }
    .panel.closed-wide { display: none; }
    .doc .try-here { display: none; }
    .panel .close { display: none; }
  }
  @media (max-width: 1023px) {
    .shell { grid-template-columns: 1fr; }
    .topbar { display: flex; position: sticky; top: 0; z-index: 15; align-items: center; gap: 8px; padding: 8px 12px; background: var(--surface); border-bottom: 1px solid var(--line); }
    .topbar .brand-title { flex: 1; font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .nav { position: fixed; inset: 0 auto 0 0; width: min(320px, 90vw); z-index: 30; transform: translateX(-100%); visibility: hidden; box-shadow: var(--shadow); }
    .nav.open { transform: none; visibility: visible; }
    @media (prefers-reduced-motion: no-preference) { .nav { transition: transform 200ms ease, visibility 200ms; } }
    .doc { padding: 24px 16px 120px; }
    .nav .nav-head .brand, .nav .nav-head .tools { display: none; }
  }

  /* ---- nav ------------------------------------------------------------------- */
  .nav-head { padding: 0 8px 12px; }
  .brand { font-size: var(--text-lg); font-weight: 650; line-height: 1.2; overflow-wrap: anywhere; }
  .brand small { display: block; font-size: var(--text-xs); font-weight: 500; color: var(--muted); margin-top: 2px; }
  .tools { display: flex; gap: 6px; margin-top: 12px; }
  .search-btn { flex: 1; display: flex; align-items: center; gap: 8px; padding: 0 10px; min-height: 36px; border: 1px solid var(--line-strong); border-radius: var(--radius); background: var(--bg); color: var(--muted); cursor: pointer; text-align: left; font-size: var(--text-sm); }
  .search-btn:hover { border-color: var(--ink); }
  .search-btn kbd { margin-left: auto; font-size: 11px; border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; background: var(--surface); }
  .icon-btn { display: inline-flex; align-items: center; justify-content: center; min-width: 36px; min-height: 36px; padding: 0 8px; border: 1px solid var(--line-strong); border-radius: var(--radius); background: var(--surface); cursor: pointer; }
  .icon-btn:hover { background: var(--bg); }
  .icon-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .nav details { margin-top: 10px; }
  .nav summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 6px; padding: 6px 8px; min-height: 32px; font-size: var(--text-xs); font-weight: 600; color: var(--muted); border-radius: var(--radius); }
  .nav summary::-webkit-details-marker { display: none; }
  .nav summary::before { content: ""; width: 6px; height: 6px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: rotate(-45deg); transition: transform 120ms; flex: none; }
  .nav details[open] summary::before { transform: rotate(45deg); }
  .nav summary:hover { background: var(--bg); }
  .nav summary .count { margin-left: auto; font-weight: 500; font-variant-numeric: tabular-nums; }
  .nav ul { list-style: none; margin: 0; padding: 0; }
  .nav .sub { padding: 6px 8px 2px 20px; font-size: 11px; color: var(--muted); }
  .nav li a { display: grid; grid-template-columns: 48px 1fr; gap: 8px; align-items: baseline; padding: 6px 8px 6px 20px; border-radius: var(--radius); text-decoration: none; min-height: 34px; font-size: var(--text-sm); }
  .nav li a:hover { background: var(--bg); }
  .nav li a[aria-current="page"] { background: var(--bg); box-shadow: inset 3px 0 0 var(--ink); }
  .nav li a .path { font-family: ui-monospace, Menlo, monospace; font-size: var(--text-xs); overflow-wrap: anywhere; }
  .nav li a.plain { grid-template-columns: 1fr; }
  .nav li a.plain .path { font-family: inherit; font-size: var(--text-sm); }
  .nav li a.top { padding-left: 8px; grid-template-columns: 1fr; font-weight: 500; }
  .nav .empty { color: var(--muted); font-size: var(--text-xs); padding: 4px 8px 4px 20px; }
  .nav .foot { margin-top: 24px; padding: 12px 8px 0; border-top: 1px solid var(--line); color: var(--muted); font-size: var(--text-xs); }
  .nav .foot a { text-decoration: underline; text-underline-offset: 2px; }

  .m { font-family: ui-monospace, Menlo, monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.02em; }
  .m-get { color: var(--get); } .m-post { color: var(--post); } .m-put, .m-patch { color: var(--put); } .m-delete { color: var(--delete); } .m-other { color: var(--other); }

  /* ---- document ---------------------------------------------------------------- */
  .crumbs { display: flex; flex-wrap: wrap; gap: 4px 8px; color: var(--muted); font-size: var(--text-xs); margin-bottom: 10px; }
  .crumbs a { text-decoration: none; } .crumbs a:hover { text-decoration: underline; }
  .page-title { font-size: var(--text-2xl); line-height: 1.15; letter-spacing: -0.02em; display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 14px; }
  .page-title .m { font-size: 14px; }
  .page-title code { font-size: 0.9em; font-weight: 600; overflow-wrap: anywhere; }
  .lede { margin-top: 10px; color: var(--muted); max-width: var(--measure); }
  .lede code { color: var(--ink); }
  .facts { display: flex; flex-wrap: wrap; gap: 6px 8px; margin-top: 14px; }
  .fact { display: inline-flex; align-items: baseline; gap: 5px; padding: 3px 9px; border: 1px solid var(--line-strong); border-radius: 999px; font-size: var(--text-xs); color: var(--muted); text-decoration: none; }
  .fact b { color: var(--ink); font-weight: 600; }
  a.fact:hover { border-color: var(--ink); }
  .actions-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }

  /* The one bold element: what a unit of work does, as connected steps. */
  .life { margin: 24px 0 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; border: 1px solid var(--line-strong); border-radius: var(--radius); overflow: hidden; background: var(--surface); }
  .life li { position: relative; flex: 1 1 170px; padding: 10px 14px 10px 18px; border-left: 1px solid var(--line); min-width: 0; }
  .life li:first-child { border-left: 0; }
  .life li::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--step); }
  .life .step { display: block; font-size: var(--text-xs); color: var(--step); font-weight: 650; margin-bottom: 2px; }
  .life .what { display: block; font-size: var(--text-sm); }
  .life .what code { font-size: 0.9em; }
  .life .what a { text-decoration: underline; text-underline-offset: 2px; text-decoration-color: var(--line-strong); }
  .life .what a:hover { text-decoration-color: currentColor; }
  .life .quiet { color: var(--muted); }
  .life .boundary { --step: var(--boundary); } .life .world { --step: var(--world); } .life .lease { --step: var(--lease); } .life .handoff { --step: var(--handoff); } .life .publish { --step: var(--publish); }
  .life-note { margin: 8px 0 0; font-size: var(--text-xs); color: var(--muted); max-width: var(--measure); }
  @media (max-width: 720px) {
    .life li { flex: 1 1 100%; border-left: 0; border-top: 1px solid var(--line); }
    .life li:first-child { border-top: 0; }
  }

  .sec { margin-top: 40px; }
  .sec > h2 { font-size: var(--text-lg); display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .sec > h2 .n { color: var(--muted); font-weight: 500; font-size: var(--text-sm); }
  .sec > p { color: var(--muted); margin-top: 6px; max-width: var(--measure); }
  .slot { margin-top: 18px; }
  .slot-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
  .slot-head h3 { font-size: var(--text-sm); font-weight: 600; }
  .where { font-size: var(--text-xs); }
  .where.b { color: var(--boundary); } .where.w { color: var(--world); } .where.q { color: var(--muted); }
  .seg { margin-left: auto; display: inline-flex; border: 1px solid var(--line-strong); border-radius: var(--radius); overflow: hidden; }
  .seg button { border: 0; background: var(--surface); padding: 3px 10px; font-size: var(--text-xs); cursor: pointer; min-height: 26px; color: var(--muted); }
  .seg button + button { border-left: 1px solid var(--line-strong); }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

  table.props { width: 100%; border-collapse: collapse; font-size: var(--text-sm); }
  table.props th { text-align: left; font-weight: 600; color: var(--muted); font-size: var(--text-xs); padding: 4px 10px 6px 0; border-bottom: 1px solid var(--line); }
  table.props td { padding: 7px 10px 7px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  table.props tr:last-child td { border-bottom: 0; }
  table.props td.name { white-space: nowrap; }
  table.props td.name code { font-weight: 600; }
  table.props .req { color: var(--delete); font-size: 11px; margin-left: 4px; vertical-align: super; }
  table.props td.type { color: var(--muted); font-family: ui-monospace, Menlo, monospace; font-size: var(--text-xs); white-space: nowrap; }
  table.props td.type a { text-decoration: underline; text-underline-offset: 2px; }
  table.props td.desc { color: var(--muted); }
  table.props td.desc code { color: var(--ink); }
  table.props .nested { margin: 8px 0 0 12px; padding-left: 12px; border-left: 2px solid var(--line); }
  table.props caption { caption-side: bottom; text-align: left; color: var(--muted); font-size: var(--text-xs); padding-top: 6px; }
  @media (max-width: 720px) {
    /* Stacked rows: name and type on one line, notes below, nothing hyphenated. */
    table.props, table.props tbody { display: block; }
    table.props thead { display: none; }
    table.props tr { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; padding: 8px 0; border-bottom: 1px solid var(--line); }
    table.props tr:last-child { border-bottom: 0; }
    table.props td { display: block; padding: 0; border: 0; }
    table.props td.name, table.props td.type { white-space: normal; overflow-wrap: anywhere; }
    table.props td.type { text-align: right; }
    table.props td.desc { grid-column: 1 / -1; }
    table.props caption { display: block; }
  }
  .note { color: var(--muted); font-size: var(--text-sm); }
  .note code { color: var(--ink); }

  .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 12px; padding: 0; list-style: none; }
  .tabs button { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 999px; padding: 4px 12px; cursor: pointer; font-size: var(--text-sm); font-variant-numeric: tabular-nums; min-height: 32px; }
  .tabs button[aria-selected="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .tabs .st-2 { border-left: 3px solid var(--ok); } .tabs .st-4 { border-left: 3px solid var(--warn); } .tabs .st-5 { border-left: 3px solid var(--bad); }
  .tabs button[aria-selected="true"].st-2, .tabs button[aria-selected="true"].st-4, .tabs button[aria-selected="true"].st-5 { border-left-color: var(--ink); }
  .resp-desc { color: var(--muted); font-size: var(--text-sm); margin: 0 0 10px; }

  pre.code { margin: 0; padding: 12px 14px; background: var(--code-bg); border: 1px solid var(--line); border-radius: var(--radius); overflow: auto; font-size: var(--text-xs); line-height: 1.5; tab-size: 2; }
  .codebar { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 0 0 6px; }
  .codebar .note { font-size: var(--text-xs); }
  .btn { border: 1px solid var(--line-strong); background: var(--surface); border-radius: var(--radius); padding: 6px 12px; cursor: pointer; font-size: var(--text-sm); min-height: 32px; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
  .btn:hover { background: var(--bg); }
  .btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .btn.primary:hover { opacity: 0.92; }
  .btn:disabled { opacity: 0.6; cursor: default; }

  .rows { display: grid; grid-template-columns: max-content 1fr; gap: 6px 18px; font-size: var(--text-sm); margin-top: 10px; }
  .rows dt { color: var(--muted); }
  .rows dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
  .rows dd a { text-decoration: underline; text-underline-offset: 2px; text-decoration-color: var(--line-strong); }
  .rows dd a:hover { text-decoration-color: currentColor; }
  @media (max-width: 480px) { .rows { grid-template-columns: 1fr; gap: 2px; } .rows dd { margin-bottom: 8px; } }

  .list { list-style: none; margin: 8px 0 0; padding: 0; }
  .list li { display: grid; grid-template-columns: 52px 1fr; gap: 10px; align-items: baseline; padding: 8px 0; border-top: 1px solid var(--line); }
  .list li:first-child { border-top: 0; }
  .list li.plain { grid-template-columns: 1fr; }
  .list a { text-decoration: none; }
  .list a:hover { text-decoration: underline; text-underline-offset: 2px; }
  .list .sub { color: var(--muted); font-size: var(--text-xs); margin-left: 8px; }
  .list code { font-weight: 600; overflow-wrap: anywhere; }

  .pager { margin-top: 64px; padding-top: 20px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; gap: 16px; font-size: var(--text-sm); }
  .pager a { text-decoration: none; display: grid; gap: 2px; max-width: 48%; }
  .pager a span { color: var(--muted); font-size: var(--text-xs); }
  .pager a b { font-weight: 600; overflow-wrap: anywhere; }
  .pager a:hover b { text-decoration: underline; text-underline-offset: 2px; }
  .pager .next { text-align: right; margin-left: auto; }
  .colophon { margin-top: 40px; color: var(--muted); font-size: var(--text-xs); max-width: var(--measure); }

  /* overview */
  .overview-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px 24px; margin-top: 20px; }
  .overview-grid a { text-decoration: none; display: grid; gap: 2px; padding: 10px 0; border-top: 2px solid var(--line-strong); }
  .overview-grid a b { font-size: var(--text-xl); font-variant-numeric: tabular-nums; font-weight: 600; }
  .overview-grid a span { color: var(--muted); font-size: var(--text-sm); }
  .overview-grid a:hover { border-top-color: var(--ink); }
  .contract { margin-top: 12px; padding: 0; list-style: none; display: grid; gap: 8px; max-width: var(--measure); }
  .contract li { padding-left: 16px; position: relative; font-size: var(--text-sm); }
  .contract li::before { content: ""; position: absolute; left: 0; top: 9px; width: 8px; height: 3px; background: var(--dot); }
  .contract .c-boundary { --dot: var(--boundary); } .contract .c-world { --dot: var(--world); } .contract .c-lease { --dot: var(--lease); } .contract .c-handoff { --dot: var(--handoff); }

  /* ---- request panel ------------------------------------------------------------- */
  .panel h2 { font-size: var(--text-base); display: flex; align-items: center; gap: 8px; }
  .panel h2 .close { margin-left: auto; }
  .panel .target { margin-top: 10px; font-family: ui-monospace, Menlo, monospace; font-size: var(--text-xs); overflow-wrap: anywhere; color: var(--muted); }
  .panel .target .m { font-size: 11px; }
  .panel .target b { color: var(--ink); font-weight: 600; }
  .panel form { display: grid; gap: 14px; margin-top: 14px; min-width: 0; }
  .panel fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: 8px; min-width: 0; }
  .panel form > *, .panel .result > * { min-width: 0; max-width: 100%; }
  .panel legend { font-size: var(--text-xs); font-weight: 600; color: var(--muted); padding: 0; margin-bottom: 6px; }
  .panel label { display: grid; gap: 4px; font-size: var(--text-xs); color: var(--muted); }
  .panel label span code { color: var(--ink); }
  .panel input, .panel textarea { font: inherit; padding: 7px 10px; border: 1px solid var(--line-strong); border-radius: var(--radius); background: var(--bg); color: inherit; width: 100%; min-height: 36px; font-size: var(--text-sm); }
  .panel textarea { font-family: ui-monospace, Menlo, monospace; font-size: var(--text-xs); min-height: 110px; resize: vertical; }
  .panel .hint { font-size: var(--text-xs); color: var(--muted); }
  .panel .send-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .panel .status { font-size: var(--text-sm); display: flex; gap: 12px; flex-wrap: wrap; font-variant-numeric: tabular-nums; }
  .panel .status .ok { color: var(--ok); font-weight: 600; } .panel .status .bad { color: var(--bad); font-weight: 600; }
  .panel .status .ms { color: var(--muted); }
  .panel .result { display: grid; gap: 8px; }
  .panel .result .tabs { margin: 0; }
  .panel .result pre { max-height: 50vh; }
  .panel .idle { color: var(--muted); font-size: var(--text-sm); margin-top: 24px; max-width: 40ch; }

  /* ---- search dialog ---------------------------------------------------------------- */
  dialog.search { border: 1px solid var(--line-strong); border-radius: 10px; padding: 0; background: var(--surface); color: inherit; width: min(640px, calc(100vw - 32px)); margin: 10vh auto; box-shadow: var(--shadow); }
  dialog.search::backdrop { background: rgba(0,0,0,0.4); }
  dialog.search input { width: 100%; border: 0; border-bottom: 1px solid var(--line); background: transparent; padding: 14px 16px; font: inherit; font-size: var(--text-lg); color: inherit; min-height: 52px; }

  dialog.search li a .t code { font-weight: 600; }
  dialog.search li a .s { display: block; color: var(--muted); font-size: var(--text-xs); }
  dialog.search .foot { display: flex; gap: 14px; padding: 8px 16px 10px; border-top: 1px solid var(--line); color: var(--muted); font-size: 11px; }

  /* Touch: every control at least 44 px tall. */
  @media (pointer: coarse) {

  }

<a class="skip" href="#doc">Skip to content</a>
<div class="shell" id="shell">
  <header class="topbar">

      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4v16" /><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor" stroke="none"/></svg>
    </button>
  </header>
  <nav class="nav" id="nav" aria-label="Application">
    <div class="nav-head">

      <div class="tools">

          <span>Search</span><kbd aria-hidden="true">⌘K</kbd>
        </button>
        <button class="icon-btn theme-btn" type="button" aria-label="Theme: system" data-theme-toggle>

<script>
(async () => {
  "use strict";
  const $ = (sel, root = document) => root.querySelector(sel);
  const el = (tag, attrs = {}, ...children) => {
    const node = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (v === undefined || v === null || v === false) continue;
      if (k === "class") node.className = v;
      else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
      else node.setAttribute(k, v === true ? "" : String(v));
    }
    for (const c of children.flat(Infinity)) if (c !== null && c !== undefined && c !== false) node.append(c instanceof Node ? c : document.createTextNode(String(c)));
    return node;
  };
  const slug = (s) => String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
  const methodClass = (m) => ["get", "post", "put", "patch", "delete"].includes(m) ? `m-${m}` : "m-other";
  const humanMs = (ms) => ms >= 1000 ? `${ms / 1000} s` : `${ms} ms`;
  const plural = (n, one, many = `${one}s`) => `${n} ${n === 1 ? one : many}`;
  const joinNodes = (nodes, sep = ", ") => nodes.flatMap((n, i) => (i ? [sep, n] : [n]));
  const store = {
    get(k, fallback = null) { try { const v = localStorage.getItem(k); return v === null ? fallback : v; } catch { return fallback; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch { /* private window, blocked storage */ } },
    sget(k, fallback = null) { try { const v = sessionStorage.getItem(k); return v === null ? fallback : v; } catch { return fallback; } },
    sset(k, v) { try { if (v === "" || v === null) sessionStorage.removeItem(k); else sessionStorage.setItem(k, v); } catch { /* same */ } },
  };
  const toast = (text) => {
    const t = el("div", { class: "toast", role: "status" }, text);
    document.body.append(t);
    setTimeout(() => t.remove(), 1600);
  };
  const copyButton = (getText, label = "Copy") => {
    const b = el("button", { class: "btn", type: "button" }, label);
    b.addEventListener("click", async () => {
      try { await navigator.clipboard.writeText(getText()); toast("Copied"); } catch { toast("Select the text and copy it"); }
    });
    return b;
  };

  // ---- theme: light / dark / system, a per-viewer convenience ------------------------
  const THEME_KEY = "usai-docs-theme";
  const themeOrder = ["system", "light", "dark"];
  const applyTheme = (mode) => {
    if (mode === "system") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", mode);
    for (const b of document.querySelectorAll("[data-theme-toggle]")) b.setAttribute("aria-label", `Theme: ${mode}. Click to change`);
  };
  let theme = store.get(THEME_KEY, "system");
  if (!themeOrder.includes(theme)) theme = "system";
  applyTheme(theme);
  for (const b of document.querySelectorAll("[data-theme-toggle]")) b.addEventListener("click", () => {
    theme = themeOrder[(themeOrder.indexOf(theme) + 1) % themeOrder.length];
    store.set(THEME_KEY, theme); applyTheme(theme); toast(`Theme: ${theme}`);
  });

  // ---- load the document -----------------------------------------------------------------
  const doc$ = $("#doc");
  let doc;
  try {
    const res = await fetch("openapi.json", { headers: { accept: "application/json" } });
    if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
    doc = await res.json();
  } catch (e) {
    doc$.replaceChildren(el("div", { class: "error-page" },
      el("h1", { class: "page-title" }, "The reference could not load"),
      el("p", { class: "lede" }, "This page reads ", el("code", {}, "openapi.json"), " next to itself; the request failed. Is the runtime serving with ", el("code", {}, "--status"), " or on its ", el("code", {}, "--status-addr"), " listener?"),
      el("pre", { class: "code" }, String(e))));
    return;
  }

  // ---- model ---------------------------------------------------------------------------------
  const info = doc.info || {};
  const title = info.title || "Application";
  const identity = info["x-usai-identity"] || info.version || "";
  const components = (doc.components && doc.components.schemas) || {};
  const securitySchemes = (doc.components && doc.components.securitySchemes) || {};
  const modules = info["x-usai-modules"] || [];
  const resources = (doc["x-usai-resources"] || []).map((r) => ({ ...r, pageId: `resources/${slug(r.name)}`, leasedBy: [] }));
  const resourceByName = new Map(resources.map((r) => [r.name, r]));
  const envReqs = doc["x-usai-env"] || [];

  const ops = [];
  for (const [path, methods] of Object.entries(doc.paths || {})) {
    for (const [method, op] of Object.entries(methods)) {
      if (!op || typeof op !== "object") continue;
      const family = op["x-usai-socket"] ? "websockets" : op["x-usai-stream"] ? "streams" : "http";
      ops.push({ kind: family, path, method, op, pageId: `${family}/${slug(method + " " + path)}`, legacyId: `op-${slug(method + " " + path)}`, module: (op.tags || [])[0], name: op.summary || `${method.toUpperCase()} ${path}` });
    }
  }
  const KINDS = [
    ["task", "tasks", "Tasks"], ["cron", "cron", "Cron"], ["queue", "queues", "Queues"],
    ["service", "services", "Services"], ["command", "commands", "Commands"],
  ];
  const familyOf = (kind) => (KINDS.find(([k]) => k === kind) || [kind, `${kind}s`])[1];
  const workloads = (doc["x-usai-workloads"] || []).map((w) => ({ ...w, pageId: `${familyOf(w.kind)}/${slug(w.name)}`, legacyId: `wl-${slug(w.id)}`, invokedBy: [], publishedBy: [] }));
  const workloadById = new Map(workloads.map((w) => [w.id, w]));
  const consumersOf = (topic) => workloads.filter((w) => w.kind === "queue" && w.detail && w.detail.topic === topic);
  // Reverse links: who leases a resource, who hands off to a task, who publishes to a topic.
  const link = (from) => ({ pageId: from.pageId, label: from.kind === "http" || from.kind === "streams" || from.kind === "websockets" ? `${from.method.toUpperCase()} ${from.path}` : from.name, sub: from.kind });
  for (const o of ops) {
    for (const r of o.op["x-usai-resources"] || []) resourceByName.get(r.name)?.leasedBy.push(link(o));
    for (const d of o.op["x-usai-dispatches"] || []) workloadById.get(d)?.invokedBy.push(link(o));
    for (const t of o.op["x-usai-publishes"] || []) for (const c of consumersOf(t)) c.publishedBy.push({ ...link(o), topic: t });
  }
  for (const w of workloads) {
    for (const name of w.resources || []) resourceByName.get(name)?.leasedBy.push(link(w));
    for (const d of w.dispatches || []) workloadById.get(d)?.invokedBy.push(link(w));
    for (const t of w.publishes || []) for (const c of consumersOf(t)) c.publishedBy.push({ ...link(w), topic: t });
  }
  const schemaNames = Object.keys(components).filter((n) => n !== "UsaiError").sort();

  document.title = `${title} reference`;
  $("#brand-title").textContent = title;
  $("#topbar-title").textContent = `${title} reference`;

  // ---- pages in nav order (also the search index and the prev/next order) ----------------------
  const pages = [];
  const addPage = (p) => { pages.push(p); return p; };
  addPage({ id: "overview", group: "Overview", title: "Overview", search: `overview ${title} ${info.description || ""}` });
  const opsByModule = new Map();
  for (const o of ops.filter((o) => o.kind === "http")) {
    const key = o.module || "";
    if (!opsByModule.has(key)) opsByModule.set(key, []);
    opsByModule.get(key).push(o);
  }
  const moduleOrder = [...opsByModule.keys()].sort((a, b) => (a === "" ? 1 : b === "" ? -1 : a.localeCompare(b)));
  for (const key of moduleOrder) for (const o of opsByModule.get(key)) addPage({ id: o.pageId, group: "HTTP", sub: key, title: `${o.method.toUpperCase()} ${o.path}`, op: o, search: `${o.method} ${o.path} ${o.op.operationId || ""} ${o.op.summary || ""} ${key}` });
  for (const [family, label] of [["streams", "Streams"], ["websockets", "WebSockets"]]) for (const o of ops.filter((o) => o.kind === family)) addPage({ id: o.pageId, group: label, title: `${o.method.toUpperCase()} ${o.path}`, op: o, search: `${family} ${o.method} ${o.path} ${o.op.operationId || ""} ${o.module || ""}` });
  for (const [kind, , label] of KINDS) for (const w of workloads.filter((w) => w.kind === kind)) addPage({ id: w.pageId, group: label, title: w.name, workload: w, search: `${kind} ${w.name} ${w.module || ""} ${(w.detail || {}).topic || ""} ${(w.detail || {}).schedule || ""}` });
  for (const w of workloads.filter((w) => !KINDS.some(([k]) => k === w.kind))) addPage({ id: w.pageId, group: "Other workloads", title: w.name, workload: w, search: `${w.kind} ${w.name}` });
  for (const r of resources) addPage({ id: r.pageId, group: "Resources", title: r.name, resource: r, search: `resource ${r.kind} ${r.name} ${r.module || ""}` });
  if (envReqs.length) addPage({ id: "env", group: "Environment", title: "Environment", search: `environment ${envReqs.map((e) => e.name).join(" ")}` });
  for (const n of schemaNames) addPage({ id: `schemas/${slug(n)}`, group: "Schemas", title: n, schema: n, search: `schema ${n} ${Object.keys((components[n] || {}).properties || {}).join(" ")}` });
  const pageById = new Map(pages.map((p) => [p.id, p]));
  const href = (id) => `#${id}`;

  // ---- nav ---------------------------------------------------------------------------------------
  const navTree = $("#nav-tree");
  const navLinks = new Map();
  const navLink = (p) => {
    const a = p.op
      ? el("a", { href: href(p.id) }, el("span", { class: `m ${methodClass(p.op.method)}` }, p.op.method.toUpperCase()), el("span", { class: "path" }, p.op.path))
      : el("a", { href: href(p.id), class: "plain" }, el("span", { class: "path" }, p.title));
    navLinks.set(p.id, a);
    return el("li", {}, a);
  };
  const navGroup = (label, items, render) => {
    if (!items.length) return document.createDocumentFragment();
    const key = `usai-docs-nav:${slug(label)}`;
    const d = el("details", { open: store.get(key, "open") !== "closed" });
    d.append(el("summary", {}, label, el("span", { class: "count" }, String(items.length))));
    d.addEventListener("toggle", () => store.set(key, d.open ? "open" : "closed"));
    d.append(render(items));
    return d;
  };
  const top = el("ul", {}, el("li", {}, (() => { const a = el("a", { href: "#overview", class: "top plain" }, el("span", { class: "path" }, "Overview")); navLinks.set("overview", a); return a; })()));
  navTree.append(top);
  navTree.append(navGroup("HTTP", pages.filter((p) => p.group === "HTTP"), (items) => {
    const ul = el("ul");
    for (const key of moduleOrder) {
      const these = items.filter((p) => (p.sub || "") === key);
      if (!these.length) continue;
      if (moduleOrder.length > 1 || key) ul.append(el("li", { class: "sub" }, key || "application"));
      for (const p of these) ul.append(navLink(p));
    }
    return ul;
  }));
  for (const label of ["Streams", "WebSockets", ...KINDS.map(([, , l]) => l), "Other workloads", "Resources"]) {
    navTree.append(navGroup(label, pages.filter((p) => p.group === label), (items) => el("ul", {}, items.map(navLink))));
  }
  if (envReqs.length) navTree.append(el("ul", { style: "margin-top:10px" }, navLink(pageById.get("env"))));
  navTree.append(navGroup("Schemas", pages.filter((p) => p.group === "Schemas"), (items) => el("ul", {}, items.map(navLink))));
  if (!ops.length && !workloads.length) navTree.append(el("p", { class: "empty" }, "Nothing declared yet. Declare an http.get(...) or a task and it appears here on the next revision."));

  // Drawer behaviour under 1024 px.
  const nav = $("#nav");
  const menuBtn = $("#menu-btn");
  const narrow = matchMedia("(max-width: 1023px)");
  const wide3 = matchMedia("(min-width: 1280px)");
  let backdrop = null;
  const closeOverlays = () => {
    nav.classList.remove("open"); menuBtn.setAttribute("aria-expanded", "false");
    if (!wide3.matches) panel.classList.remove("open");
    if (backdrop) { backdrop.remove(); backdrop = null; }
  };
  const showBackdrop = () => { if (!backdrop) { backdrop = el("div", { class: "backdrop", onclick: closeOverlays }); document.body.append(backdrop); } };
  menuBtn.addEventListener("click", () => {
    const open = !nav.classList.contains("open");
    closeOverlays();
    if (open) { nav.classList.add("open"); menuBtn.setAttribute("aria-expanded", "true"); showBackdrop(); nav.querySelector("a")?.focus(); }
  });
  nav.addEventListener("click", (e) => { if (e.target.closest("a") && narrow.matches) closeOverlays(); });

  // ---- schema rendering --------------------------------------------------------------------------------
  const deref = (schema) => {
    if (schema && schema.$ref) {
      const name = schema.$ref.split("/").pop();
      return { ...(components[name] || {}), __name: name };
    }
    return schema || {};
  };
  const typeOf = (s) => {
    s = deref(s);
    if (s.enum) return "enum";
    if (s.const !== undefined) return `const ${JSON.stringify(s.const)}`;
    if (Array.isArray(s.type)) return s.type.join(" | ");
    if (s.anyOf || s.oneOf) return (s.anyOf || s.oneOf).map(typeOf).join(" | ");
    if (s.type === "array") return `array of ${typeOf(s.items || {})}`;
    if (s.type) return s.format ? `${s.type} (${s.format})` : s.type;
    if (s.properties) return "object";
    return "any";
  };
  const typeCell = (s) => {
    const name = s && s.$ref ? s.$ref.split("/").pop() : null;
    const text = typeOf(s);
    if (name && name !== "UsaiError" && components[name]) return el("a", { href: href(`schemas/${slug(name)}`) }, name);
    return text;
  };
  const constraints = (s) => {
    s = deref(s);
    const out = [];
    if (s.enum) out.push(`one of ${s.enum.map((v) => JSON.stringify(v)).join(", ")}`);
    const SAFE = 9007199254740991;
    if (s.minimum !== undefined && s.minimum !== -SAFE) out.push(`≥ ${s.minimum}`);
    if (s.maximum !== undefined && s.maximum !== SAFE) out.push(`≤ ${s.maximum}`);
    if (s.exclusiveMinimum !== undefined) out.push(`> ${s.exclusiveMinimum}`);
    if (s.exclusiveMaximum !== undefined) out.push(`< ${s.exclusiveMaximum}`);
    if (s.minLength !== undefined) out.push(`min length ${s.minLength}`);
    if (s.maxLength !== undefined) out.push(`max length ${s.maxLength}`);
    if (s.minItems !== undefined) out.push(`min items ${s.minItems}`);
    if (s.maxItems !== undefined) out.push(`max items ${s.maxItems}`);
    if (s.pattern && !s.format) out.push(`matches /${s.pattern}/`);
    if (s.default !== undefined) out.push(`default ${JSON.stringify(s.default)}`);
    if (s.description) out.unshift(s.description);
    return out;
  };
  const propsTable = (schema, depth = 0, opts = { markRequired: true }) => {
    const raw = schema;
    schema = deref(schema);
    if (schema.type === "array" && schema.items) {
      const inner = deref(schema.items);
      if (inner.properties) return el("div", {}, el("p", { class: "note" }, "Array of objects, each:"), propsTable(schema.items, depth, opts));
      return el("p", { class: "note" }, `Array of ${typeOf(inner)}${constraints(inner).length ? " — " + constraints(inner).join("; ") : ""}.`);
    }
    if (!schema.properties) {
      const c = constraints(schema);
      return el("p", { class: "note" }, `${typeOf(raw)}${c.length ? " — " + c.join("; ") : ""}.`);
    }
    const required = new Set(schema.required || []);
    const table = el("table", { class: "props" }, el("thead", {}, el("tr", {}, el("th", {}, "Field"), el("th", {}, "Type"), el("th", {}, "Notes"))));
    const tbody = el("tbody");
    for (const [name, sub] of Object.entries(schema.properties)) {
      const s = deref(sub);
      const nested = !(sub && sub.$ref) && (s.properties || (s.type === "array" && deref(s.items || {}).properties)) && depth < 4;
      const notes = constraints(s);
      tbody.append(el("tr", {},
        el("td", { class: "name" }, el("code", {}, name), opts.markRequired && required.has(name) ? el("span", { class: "req", title: "required" }, "required") : null),
        el("td", { class: "type" }, typeCell(sub), !opts.markRequired && !required.has(name) ? "?" : ""),
        el("td", { class: "desc" }, notes.join("; ") || (opts.markRequired && !required.has(name) ? "optional" : ""), nested ? el("div", { class: "nested" }, propsTable(s, depth + 1, opts)) : null)));
    }
    table.append(tbody);
    if (schema.additionalProperties === false) table.append(el("caption", {}, "Unknown fields are rejected."));
    return table;
  };
  const sample = (schema, depth = 0) => {
    schema = deref(schema);
    if (schema.default !== undefined) return schema.default;
    if (schema.const !== undefined) return schema.const;
    if (schema.enum) return schema.enum[0];
    if (schema.anyOf || schema.oneOf) return sample((schema.anyOf || schema.oneOf)[0], depth + 1);
    const t = Array.isArray(schema.type) ? schema.type.find((x) => x !== "null") : schema.type;
    if (t === "object" || schema.properties) {
      const out = {};
      for (const [k, v] of Object.entries(schema.properties || {})) if (depth < 5) out[k] = sample(v, depth + 1);
      return out;
    }
    if (t === "array") return schema.items && depth < 5 ? [sample(schema.items, depth + 1)] : [];
    if (t === "integer") return schema.minimum !== undefined ? schema.minimum : 1;
    if (t === "number") return schema.minimum !== undefined ? schema.minimum : 1.5;
    if (t === "boolean") return true;
    if (t === "string") {
      if (schema.format === "uuid") return "6f1a2b3c-4d5e-4f60-8a71-92b3c4d5e6f7";
      if (schema.format === "email") return "ayu@example.com";
      if (schema.format === "date-time") return "2026-01-01T00:00:00Z";
      if (schema.format === "date") return "2026-01-01";
      if (schema.format === "uri" || schema.format === "url") return "https://example.com/";
      if (schema.pattern && /\\d\{4\}-\\d\{2\}-\\d\{2\}/.test(schema.pattern)) return "2026-01-01";
      if (schema.pattern && /^\^?\[?[a-z0-9]/i.test(schema.pattern) && schema.pattern.includes("-")) return "example-slug";
      if (schema.minLength && schema.minLength > 6) return "string".padEnd(schema.minLength, "x");
      return "string";
    }
    return null;
  };
  // A contract slot: table by default, the JSON Schema on demand.
  const slotBlock = (label, schema, whereNode, opts) => {
    const wrap = el("div", { class: "slot" });

    if (o.kind !== "websockets") frag.append(responsesBlock(op));
    if (o.kind !== "websockets") {
      const block = snippetBlock(o);

      refreshSnippets = () => { const pre = block.querySelector("pre code"); const lang = [...block.querySelectorAll("[role=tab]")].find((b) => b.getAttribute("aria-selected") === "true"); if (pre && lang) pre.textContent = snippets[lang.dataset.lang](requestPlan(o, panelValuesFor(o))); };

  };
  // Snippets follow what is typed in the panel, when the panel shows this operation.
  const panelValuesFor = (o) => {
    if (panelOp !== o) return { path: {}, query: {}, header: {}, base: baseUrl() };
    const v = { path: {}, query: {}, header: {}, base: (panel.querySelector("input[type=url]") || {}).value || baseUrl(), body: null };

  };

  const kindWord = { task: "task", cron: "cron job", command: "command", service: "service", queue: "queue consumer" };
  const pageWorkload = (w) => {
    const frag = document.createDocumentFragment();
    const d = w.detail || {};
    const groupLabel = (KINDS.find(([k]) => k === w.kind) || [, , "Other workloads"])[2];
    frag.append(crumbs({ id: "overview", title }, groupLabel));
    frag.append(el("h1", { class: "page-title", id: "page-h1" }, el("code", {}, w.name)));
    const lede = {
      task: ["A task runs in a fresh world when an endpoint or another workload hands it off (", el("code", {}, "ctx.tasks.dispatch"), ", ownership transferred) or awaits it (", el("code", {}, "ctx.tasks.invoke"), ", owned by the caller)."],
      cron: ["Runs on the schedule ", el("code", {}, d.schedule || "?"), " in a fresh world per tick. ", d.overlap === "skip" ? "A tick that would overlap a running one is skipped." : d.overlap ? `Overlapping ticks: ${d.overlap}.` : ""],
      command: ["Runs on demand from the command line, in a fresh world, with the runtime's resources available."],

    }[w.kind] || [`A ${w.kind} workload.`];

    if (w.module) facts.append(el("span", { class: "fact" }, "module", el("b", {}, w.module)));
    if (w.id) facts.append(el("span", { class: "fact" }, "id", el("b", {}, el("code", {}, w.id))));
    frag.append(facts);
    frag.append(lifecycle({
      boundaryText: w.input ? ["input refused before a world exists"] : w.message ? ["message refused before a world exists"] : w.kind === "cron" ? [el("span", { class: "quiet" }, "the clock; nothing to validate")] : w.kind === "service" ? [el("span", { class: "quiet" }, "revision activation")] : w.kind === "command" ? [el("span", { class: "quiet" }, "arguments from the command line")] : undefined,
      lifetime: w.lifetime === "persistent" ? "persistent" : w.lifetime === "connection" ? "connection" : `finite (${w.kind})`,
      resources: (w.resources || []).map((name) => ({ name, kind: (resourceByName.get(name) || {}).kind })),
      dispatches: w.dispatches || [], publishes: w.publishes || [],
    }));
    if (w.input) frag.append(el("div", { class: "sec" }, el("h2", {}, "Input"), slotBlock("Input", w.input, el("span", { class: "where b" }, "validated before a world exists"))));
    if (w.message) frag.append(el("div", { class: "sec" }, el("h2", {}, "Message"), slotBlock("Message", w.message, el("span", { class: "where b" }, "validated before a world exists"))));
    if (w.kind === "task" || w.kind === "queue") frag.append(relatedList(w.kind === "task" ? "Invoked or dispatched by" : "Published by", w.kind === "task" ? w.invokedBy : w.publishedBy, w.kind === "task" ? "Nothing in this application hands off to this task; it can still be run by hand." : "Nothing in this application publishes to this topic; messages arrive from outside or from another revision."));
    const run = el("div", { class: "sec" }, el("h2", {}, "Run it by hand"));
    const cmd = { task: `usai task run ${w.name} --input '${w.input ? JSON.stringify(sample(w.input)) : "{}"}'`, cron: `usai cron run ${w.name}`, command: `usai app ${w.name} [args]`, service: null, queue: null }[w.kind];
    if (cmd) { const pre = el("pre", { class: "code" }, el("code", {}, cmd)); run.append(el("p", {}, w.kind === "cron" ? "One tick, without the wall clock, in a fresh world." : "One invocation in a fresh world, from the project root."), el("div", { class: "codebar", style: "margin-top:10px" }, el("span", { class: "note" }, "shell"), copyButton(() => pre.textContent)), pre); }
    else run.append(el("p", {}, w.kind === "service" ? "Services are not run by hand: the runtime starts one with the revision. Watch it in /_usai/status." : "Queue consumers are driven by messages: publish one from an endpoint or a task and it runs."));
    frag.append(run);
    return frag;
  };

  const resourceText = {
    postgres: "A connection pool owned by the runtime for its whole lifetime. A world leases one connection per operation and returns it only after a terminal outcome; a lease whose outcome is unknown is quarantined, then removed and replaced, never reused.",
    "cache.local": "A runtime-local cache. It survives worlds and revisions in this process; it is not shared across processes or replicas.",
    "http.client": "Outbound HTTP to one declared origin. Every request is a leased operation with a deadline and a concurrency bound; requests to another origin are refused before they leave.",
  };
  const pageResource = (r) => {
    const frag = document.createDocumentFragment();
    frag.append(crumbs({ id: "overview", title }, "Resources"));
    frag.append(el("h1", { class: "page-title", id: "page-h1" }, el("code", {}, r.name)));
    frag.append(el("p", { class: "lede" }, resourceText[r.kind] || "Owned by the runtime for its lifetime; worlds lease it per operation."));
    const facts = el("div", { class: "facts" }, el("span", { class: "fact" }, "kind", el("b", {}, r.kind)));
    if (r.module) facts.append(el("span", { class: "fact" }, "declared by", el("b", {}, r.module)));
    frag.append(facts);
    frag.append(relatedList("Leased by", r.leasedBy, "No workload leases this resource yet."));
    return frag;
  };
  const pageEnv = () => {
    const frag = document.createDocumentFragment();
    frag.append(crumbs({ id: "overview", title }));
    frag.append(el("h1", { class: "page-title", id: "page-h1" }, "Environment"));
    frag.append(el("p", { class: "lede" }, "Checked when a revision activates, not at the first request: a missing required variable keeps the revision from ever serving."));
    const t = el("table", { class: "props", style: "margin-top:20px" }, el("thead", {}, el("tr", {}, el("th", {}, "Variable"), el("th", {}, "Type"), el("th", {}, "Notes"))));
    const tb = el("tbody");
    for (const e of envReqs) tb.append(el("tr", {}, el("td", { class: "name" }, el("code", {}, e.name), e.required ? el("span", { class: "req" }, "required") : null), el("td", { class: "type" }, e.kind), el("td", { class: "desc" }, e.values && e.values.length ? `one of ${e.values.join(", ")}` : e.required ? "required" : "optional")));
    t.append(tb); frag.append(t);
    return frag;
  };
  const pageSchema = (name) => {
    const frag = document.createDocumentFragment();
    frag.append(crumbs({ id: "overview", title }, "Schemas"));
    frag.append(el("h1", { class: "page-title", id: "page-h1" }, el("code", {}, name)));
    const schema = components[name] || {};
    if (schema.description) frag.append(el("p", { class: "lede" }, schema.description));
    frag.append(slotBlock("Fields", schema, null));
    const users = [];
    for (const o of ops) if (JSON.stringify(o.op).includes(`"#/components/schemas/${name}"`)) users.push(link(o));
    for (const w of workloads) if (JSON.stringify([w.input, w.message]).includes(`"#/components/schemas/${name}"`)) users.push(link(w));
    frag.append(relatedList("Used by", users, "Not referenced by an operation directly."));
    return frag;
  };
  const pageOverview = () => {
    const frag = document.createDocumentFragment();
    frag.append(el("h1", { class: "page-title", id: "page-h1" }, title));
    frag.append(el("p", { class: "lede" }, info.description || ["Everything below is read from the application definition this runtime is executing, the same one ", el("code", {}, "usai inspect"), " and the router read. When the application changes, this page changes with its next revision."]));
    const facts = el("div", { class: "facts" });
    if (identity) facts.append(el("span", { class: "fact" }, "revision", el("b", {}, el("code", {}, identity))));
    if (modules.length) facts.append(el("span", { class: "fact" }, plural(modules.length, "module"), el("b", {}, modules.join(", "))));
    frag.append(facts);
    const grid = el("div", { class: "overview-grid" });
    const count = (label, n, id) => { if (n) grid.append(el("a", { href: href(id) }, el("b", {}, String(n)), el("span", {}, label))); };
    const first = (group) => (pages.find((p) => p.group === group) || {}).id;
    count(plural(ops.filter((o) => o.kind === "http").length, "HTTP operation").replace(/^\d+ /, ""), ops.filter((o) => o.kind === "http").length, first("HTTP"));
    count("streams", ops.filter((o) => o.kind === "streams").length, first("Streams"));
    count("WebSockets", ops.filter((o) => o.kind === "websockets").length, first("WebSockets"));
    for (const [kind, , label] of KINDS) count(label.toLowerCase(), workloads.filter((w) => w.kind === kind).length, first(label));
    count("resources", resources.length, first("Resources"));
    count(plural(envReqs.length, "environment variable").replace(/^\d+ /, ""), envReqs.length, "env");
    count("schemas", schemaNames.length, first("Schemas"));
    frag.append(grid);
    if (!ops.length && !workloads.length) frag.append(el("p", { class: "note", style: "margin-top:24px" }, "This application declares nothing yet. Declare an ", el("code", {}, "http.get(...)"), " or a ", el("code", {}, "task(...)"), " and it appears here on the next revision."));
    // Modules with their operations.
    if (opsByModule.size) {
      const sec = el("div", { class: "sec" }, el("h2", {}, "HTTP operations"));
      for (const key of moduleOrder) {
        const these = opsByModule.get(key);
        const ul = el("ul", { class: "list" });
        for (const o of these) ul.append(el("li", {}, el("span", { class: `m ${methodClass(o.method)}` }, o.method.toUpperCase()), el("a", { href: href(o.pageId) }, el("code", {}, o.path), o.op.summary && slug(o.op.summary) !== slug(`${o.method} ${o.path}`) ? el("span", { class: "sub" }, o.op.summary) : null)));
        if (moduleOrder.length > 1 || key) sec.append(el("h3", { style: "margin-top:18px;font-size:var(--text-sm)" }, key || "Application"));
        sec.append(ul);
      }
      frag.append(sec);
    }
    if (Object.keys(securitySchemes).length) {
      const sec = el("div", { class: "sec" }, el("h2", {}, "Authentication"), el("p", {}, "Resolved before the handler runs; a rejected credential is a 401 and the handler never runs. Try it remembers one value per scheme for this browser tab."));
      const dl = el("dl", { class: "rows" });
      for (const [name, s] of Object.entries(securitySchemes)) dl.append(el("dt", {}, el("code", {}, name)), el("dd", {}, s.type === "http" ? [el("code", {}, "authorization: Bearer <token>")] : [el("code", {}, `${s.name || "authorization"}: <value>`), s.description ? ` (${s.description})` : ""]));
      sec.append(dl); frag.append(sec);
    }
    const contract = el("div", { class: "sec" }, el("h2", {}, "How work enters this application"),
      el("ul", { class: "contract" },
        el("li", { class: "c-boundary" }, el("b", {}, "Boundary."), " Routing, decoding and schema rejections happen before any world exists; a 400 costs the application nothing. An auth rejection (401) stops before the handler."),
        el("li", { class: "c-world" }, el("b", {}, "Fresh world."), " Every unit of work (a request, a task, a cron tick, a queue message) runs in a world of its own with a deadline; nothing leaks between two of them."),

        el("li", { class: "c-handoff" }, el("b", {}, "Hand-off."), " Work that outlives a response is dispatched to a task or published to a queue, explicitly; a world that ends with un-awaited work is a runtime error, not a silent drop.")));
    frag.append(contract);
    frag.append(el("p", { class: "colophon" }, "Served by the Usai runtime at ", el("code", {}, "/_usai/docs"), " from ", el("a", { href: "openapi.json" }, el("code", {}, "/_usai/openapi.json")), ". The ", el("a", { href: "openapi.json?profile=public" }, "public profile"), " of that document is the consumer contract without the runtime facts, the same file ", el("code", {}, "usai generate openapi --public"), " writes. What the SDK itself takes and promises (", el("code", {}, "http.get"), ", ", el("code", {}, "ctx.tasks.dispatch"), ", ", el("code", {}, "postgres"), ") is the ", el("a", { href: "https://github.com/gmedia/usai/tree/main/docs/sdk" }, "SDK reference"), "."));
    return frag;

  // ---- router --------------------------------------------------------------------------------------------------
  const legacy = new Map();
  for (const o of ops) legacy.set(o.legacyId, o.pageId);
  for (const w of workloads) legacy.set(w.legacyId, w.pageId);
  legacy.set("resources", resources.length ? resources[0].pageId : "overview");
  const resolve = () => {
    let id = decodeURIComponent(location.hash.slice(1)) || "overview";
    if (legacy.has(id)) id = legacy.get(id);
    return pageById.get(id) || null;
  };
  let currentPage = null;
  const render = () => {
    const page = resolve();
    closeOverlays();
    doc$.replaceChildren();
    if (!page) {
      doc$.append(el("div", { class: "error-page" }, el("h1", { class: "page-title", id: "page-h1" }, "Not in this application"),
        el("p", { class: "lede" }, "Nothing is declared at ", el("code", {}, location.hash), " in this revision. Search for it, or start from the ", el("a", { href: "#overview" }, "overview"), "."),
        el("div", { class: "actions-row" }, el("button", { type: "button", class: "btn", onclick: openSearch }, "Search"))));

    } else {
      currentPage = page;
      if (page.op) { doc$.append(pageOp(page.op)); renderPanel(page.op); }
      else { refreshSnippets = () => {}; renderPanel(null); doc$.append(page.workload ? pageWorkload(page.workload) : page.resource ? pageResource(page.resource) : page.schema ? pageSchema(page.schema) : page.id === "env" ? pageEnv() : pageOverview()); }
      const i = pages.indexOf(page);
      const prev = pages[i - 1], next = pages[i + 1];
      if (prev || next) doc$.append(el("nav", { class: "pager", "aria-label": "Previous and next" },
        prev ? el("a", { href: href(prev.id), class: "prev" }, el("span", {}, "Previous"), el("b", {}, prev.title)) : el("span"),
        next ? el("a", { href: href(next.id), class: "next" }, el("span", {}, "Next"), el("b", {}, next.title)) : null));
      document.title = page.id === "overview" ? `${title} reference` : `${page.title}: ${title} reference`;
    }
    for (const [id, a] of navLinks) { if (page && id === page.id) { a.setAttribute("aria-current", "page"); const d = a.closest("details"); if (d) d.open = true; } else a.removeAttribute("aria-current"); }
    const current = page && navLinks.get(page.id);
    if (current && typeof current.scrollIntoView === "function") current.scrollIntoView({ block: "nearest" });
    window.scrollTo({ top: 0 });
    $("#page-h1")?.focus?.();
  };
  window.addEventListener("hashchange", render);

  // ---- search ------------------------------------------------------------------------------------------------------------
  const dialog = $("#search");
  const input = $("#search-input");
  const results = $("#search-results");
  const openSearch = () => { if (typeof dialog.showModal !== "function") { location.hash = "#overview"; return; } dialog.showModal(); input.value = ""; runSearch(); input.focus(); };
  $("#search-btn").addEventListener("click", openSearch);
  $("#search-btn-small").addEventListener("click", openSearch);
  let selected = 0;
  const runSearch = () => {
    const q = input.value.trim().toLowerCase();
    const terms = q.split(/\s+/).filter(Boolean);
    const score = (p) => terms.reduce((n, t) => n + (p.title.toLowerCase().includes(t) ? 2 : p.search.toLowerCase().includes(t) ? 1 : 0), 0);
    const hits = pages.map((p, i) => ({ p, s: score(p), i })).filter((h) => h.s >= terms.length).sort((a, b) => b.s - a.s || a.i - b.i).map((h) => h.p).slice(0, 40);
    results.replaceChildren();
    if (!hits.length) { results.append(el("li", { class: "none" }, `Nothing matches “${input.value.trim()}” in this application.`)); return; }
    let lastGroup = null;
    hits.forEach((p, i) => {
      if (p.group !== lastGroup) { results.append(el("li", { class: "group", role: "presentation" }, p.group)); lastGroup = p.group; }
      const a = p.op
        ? el("a", { href: href(p.id), role: "option", id: `sr-${i}`, "aria-selected": String(i === selected) }, el("span", { class: `m ${methodClass(p.op.method)}` }, p.op.method.toUpperCase()), el("span", { class: "t" }, el("code", {}, p.op.path), p.op.op.summary && slug(p.op.op.summary) !== slug(p.title) ? el("span", { class: "s" }, p.op.op.summary) : p.sub ? el("span", { class: "s" }, p.sub) : null))
        : el("a", { href: href(p.id), role: "option", id: `sr-${i}`, class: "plain", "aria-selected": String(i === selected) }, el("span", { class: "t" }, el("code", {}, p.title), el("span", { class: "s" }, p.workload ? kindWord[p.workload.kind] || p.workload.kind : p.resource ? p.resource.kind : p.group.toLowerCase())));
      a.addEventListener("click", () => dialog.close());
      results.append(el("li", {}, a));
    });
    input.setAttribute("aria-activedescendant", `sr-${selected}`);
  };
  input.addEventListener("input", () => { selected = 0; runSearch(); });
  input.addEventListener("keydown", (e) => {
    const options = [...results.querySelectorAll("[role=option]")];
    if (!options.length) return;
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      selected = (selected + (e.key === "ArrowDown" ? 1 : options.length - 1)) % options.length;
      options.forEach((o, i) => o.setAttribute("aria-selected", String(i === selected)));
      options[selected].scrollIntoView({ block: "nearest" });
      input.setAttribute("aria-activedescendant", `sr-${selected}`);
    } else if (e.key === "Enter") { e.preventDefault(); options[selected]?.click(); }
  });
  dialog.addEventListener("click", (e) => { if (e.target === dialog) dialog.close(); });

  // ---- keyboard ----------------------------------------------------------------------------------------------------------
  document.addEventListener("keydown", (e) => {
    const typing = /input|textarea|select/i.test(document.activeElement?.tagName || "") || document.activeElement?.isContentEditable;
    if ((e.key === "k" || e.key === "K") && (e.metaKey || e.ctrlKey)) { e.preventDefault(); if (dialog.open) dialog.close(); else openSearch(); return; }
    if (typing || dialog.open) return;
    if (e.key === "/") { e.preventDefault(); openSearch(); }
    else if (e.key === "Escape") closeOverlays();
    else if ((e.key === "[" || e.key === "]") && currentPage) {
      const i = pages.indexOf(currentPage) + (e.key === "]" ? 1 : -1);
      if (pages[i]) location.hash = href(pages[i].id);
    }
  });

  render();
})();
</script>
