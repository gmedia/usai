# PHP-FPM + nginx comparator. DATABASE_URL must be reachable from the
# containers: the suite rewrites 127.0.0.1 to host.docker.internal (the
# docker gateway), so a PostgreSQL published only on 127.0.0.1 is NOT
# reachable — publish it on the gateway too (`-p 172.17.0.1:54330:5432`)
# or on all interfaces of a throwaway host.
services:
  php:
    build: .
    volumes: ["./public:/var/www/public:ro"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
    extra_hosts: ["host.docker.internal:host-gateway"]
  nginx:
    image: nginx:1.27-alpine
    ports: ["3005:3005"]
    volumes: ["./nginx.conf:/etc/nginx/nginx.conf:ro", "./public:/var/www/public:ro"]
    depends_on: [php]
