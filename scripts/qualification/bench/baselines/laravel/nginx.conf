events {}
http {
  access_log off;
  # nginx must reuse its connections to php-fpm. Without an `upstream` block
  # with `keepalive`, `fastcgi_keep_conn on` does nothing: nginx opens a new
  # TCP connection per request, and at a few thousand requests a second the
  # container runs out of ephemeral ports — `connect() … (99: Address not
  # available)` and a 502 for the client, which looks like PHP failing under
  # load when it is the proxy in front of it. (Measured on 2026-09-23: up to
  # 32 % of requests at c=64 in a run whose php-fpm log had nothing but 200s.)
  upstream php_backend {
    server php:9000;
    keepalive 64;
  }
  server {
    listen 3007;
    root /var/www/public;
    index index.php;
    location / {
      # Laravel's front controller; the public directory lives in the php
      # container, so nginx never serves files itself.
      fastcgi_pass php_backend;
      fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
      fastcgi_param REQUEST_METHOD $request_method;
      fastcgi_param REQUEST_URI $request_uri;
      fastcgi_param DOCUMENT_URI /index.php;
      fastcgi_param SCRIPT_NAME /index.php;
      fastcgi_param CONTENT_TYPE $content_type;
      fastcgi_param CONTENT_LENGTH $content_length;
      fastcgi_param QUERY_STRING $query_string;
      fastcgi_param SERVER_PROTOCOL $server_protocol;
      fastcgi_param REMOTE_ADDR $remote_addr;
      fastcgi_param SERVER_NAME $host;
      fastcgi_param HTTPS off;
      fastcgi_param HTTP_X_API_KEY $http_x_api_key;
      fastcgi_keep_conn on;
    }
  }
}
