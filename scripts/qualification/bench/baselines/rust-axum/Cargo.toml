[package]
name = "bench-rust-axum"
version = "0.0.0"
edition = "2024"
publish = false

# The attribution control: a native Rust server doing the same work with no
# execution world at all. Not a member of the Usai workspace on purpose.
[workspace]

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
deadpool-postgres = "0.14"
tokio-postgres = "0.7"
regex = "1"
uuid = { version = "1", features = ["serde"] }

[profile.release]
lto = "thin"
codegen-units = 1
