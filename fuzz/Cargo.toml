[package]
name = "usai-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
usai-runtime = { path = "../crates/usai-runtime", features = ["fuzzing"] }

[[bin]]
name = "manifest"
path = "fuzz_targets/manifest.rs"
test = false
doc = false
bench = false

[[bin]]
name = "http_boundary"
path = "fuzz_targets/http_boundary.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sourcemap"
path = "fuzz_targets/sourcemap.rs"
test = false
doc = false
bench = false

[[bin]]
name = "guest_bridge"
path = "fuzz_targets/guest_bridge.rs"
test = false
doc = false
bench = false

[[bin]]
name = "postgres_params"
path = "fuzz_targets/postgres_params.rs"
test = false
doc = false
bench = false

# This is its own workspace, so the root's `[patch.crates-io]` does not reach
# it: without this the fuzz targets build `usai-runtime` against an unpatched
# wasmtime from crates.io. That was invisible while the vendored patch only
# changed behaviour inside an existing function (the pagemap reset) — the
# fuzzers simply ran without the fix. It stopped being invisible when the
# second patch added an API: the build failed on
# `Engine::release_idle_pool_memory`. Both patches now apply here too.
[patch.crates-io]
wasmtime = { path = "../vendor/wasmtime" }
