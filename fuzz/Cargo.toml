[package]
name = "usai-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
usai-runtime = { path = "../crates/usai-runtime", features = ["fuzzing"] }

[[bin]]
name = "manifest"
path = "fuzz_targets/manifest.rs"
test = false
doc = false
bench = false

[[bin]]
name = "http_boundary"
path = "fuzz_targets/http_boundary.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sourcemap"
path = "fuzz_targets/sourcemap.rs"
test = false
doc = false
bench = false

[[bin]]
name = "guest_bridge"
path = "fuzz_targets/guest_bridge.rs"
test = false
doc = false
bench = false

[[bin]]
name = "postgres_params"
path = "fuzz_targets/postgres_params.rs"
test = false
doc = false
bench = false
