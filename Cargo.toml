[workspace]
members = ["crates/usai-runtime", "crates/usai-cli"]
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/gmedia/usai"
rust-version = "1.98"

[workspace.dependencies]
usai-runtime = { path = "crates/usai-runtime" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal", "fs", "process"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
rquickjs = { version = "0.13", features = ["futures", "parallel"] }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "server-graceful", "service", "http1"] }
http-body-util = "0.1"
bytes = "1"
matchit = "0.9"
jsonschema = { version = "0.56", default-features = false }
sha2 = "0.10"
hex = "0.4"
clap = { version = "4", features = ["derive"] }
notify = "9.0.0-rc.5"
form_urlencoded = "1"
base64 = "0.22"
http = "1"
croner = "4"
glob = "0.3"
tokio-tungstenite = "0.30"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1", "with-uuid-1", "with-chrono-0_4"] }
deadpool-postgres = "0.14"
uuid = { version = "1", features = ["serde"] }
rust_decimal = { version = "1", default-features = false, features = ["db-postgres", "std"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
async-trait = "0.1"

[profile.release]
debug = 1
