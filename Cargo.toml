[workspace]
members = ["crates/usai-runtime", "crates/usai-cli"]
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/gmedia/usai"
rust-version = "1.98"

[workspace.dependencies]
usai-runtime = { path = "crates/usai-runtime" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal", "fs", "process"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
rquickjs = { version = "0.13", features = ["futures", "parallel"] }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "service", "http1"] }
http-body-util = "0.1"
bytes = "1"
matchit = "0.9"
jsonschema = { version = "0.56", default-features = false }
sha2 = "0.10"
hex = "0.4"
clap = { version = "4", features = ["derive"] }
notify = "9.0.0-rc.5"
async-trait = "0.1"

[profile.release]
debug = 1
