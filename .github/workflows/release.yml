name: release

# Tag `vX.Y.Z` → one release, three artefacts: binaries on the GitHub
# release, npm packages, Docker images (sakaladev/usai:X.Y.Z and X.Y.Z-dev,
# linux/amd64 + linux/arm64) — all at the same version. The tag must match
# the SDK/runtime version. `workflow_dispatch` runs only the npm job, to
# publish a package version that is not on the registry yet (e.g. a
# create-usai fix) without cutting a runtime release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  # Build provenance: every tarball and image carries a signed statement of
  # which workflow, at which commit, produced it (`gh attestation verify`).
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  binaries:
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - name: Version matches the tag
        run: |
          v=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "Cargo.toml is $v, tag is ${GITHUB_REF_NAME}"; exit 1; }
      - uses: dtolnay/rust-toolchain@stable
        if: runner.os == 'macOS'
        with:
          toolchain: 1.98.1
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        if: runner.os == 'macOS'
      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: cargo build --profile dist -p usai-cli --target ${{ matrix.target }} --locked
      # The Linux binaries are compiled on Debian 12, not on the runner: a
      # binary carries the glibc version it was *built* against, and the
      # runner's is newer than the floor in SUPPORTED.md (0.0.6 shipped
      # `pidfd_spawnp@GLIBC_2.39` from Rust std and would not start on
      # Debian 12 — including inside our own bookworm-based images).
      - name: Build (Linux, on the glibc floor)
        if: runner.os == 'Linux'
        run: |
          docker run --rm -v "$PWD":/src -w /src \
            -e CARGO_TERM_COLOR -e CARGO_INCREMENTAL \
            rust:1.98-bookworm \
            cargo build --profile dist -p usai-cli --target ${{ matrix.target }} --locked
          sudo chown -R "$(id -u):$(id -g)" target
      - name: The binary starts on the oldest supported distribution
        if: runner.os == 'Linux'
        run: |
          bin=target/${{ matrix.target }}/dist/usai
          max=$(objdump -T "$bin" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          echo "highest glibc symbol version required: $max"
          [ "$(printf '%s\nGLIBC_2.36\n' "$max" | sort -V | tail -1)" = "GLIBC_2.36" ] \
            || { echo "::error::$max is above the glibc 2.36 floor in SUPPORTED.md"; exit 1; }
          docker run --rm -v "$PWD/$bin":/usai:ro debian:bookworm-slim /usai --version
      - name: Package
        run: |
          name=usai-${GITHUB_REF_NAME}-${{ matrix.target }}
          mkdir -p dist/$name
          cp target/${{ matrix.target }}/dist/usai dist/$name/
          cp LICENSE README.md dist/$name/
          tar -C dist -czf dist/$name.tar.gz $name
          (cd dist && shasum -a 256 $name.tar.gz > $name.tar.gz.sha256)
      - name: Provenance for the tarball
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.tar.gz
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
          generate_release_notes: true
      # The same binary goes into the Docker image of this architecture.
      - uses: actions/upload-artifact@v4
        if: startsWith(matrix.target, 'x86_64-unknown-linux') || startsWith(matrix.target, 'aarch64-unknown-linux')
        with:
          name: binary-${{ matrix.target }}
          path: target/${{ matrix.target }}/dist/usai
          retention-days: 7

  npm:
    runs-on: ubuntu-24.04
    # Publishes with npm Trusted Publishing (OIDC, no long-lived secret) when
    # the packages are configured for it on npmjs.com, or with NPM_TOKEN.
    permissions:
      contents: read
      id-token: write
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r run build
      - name: Version matches the tag
        run: |
          v=$(node -p "require('./packages/usai/package.json').version")
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "packages/usai is $v, tag is ${GITHUB_REF_NAME}"; exit 1; }
          fi
          s=$(node -p "require('./packages/create-usai/package.json').sdkVersion")
          [ "$s" = "$v" ] || { echo "create-usai scaffolds @sakaladev/usai@$s but the SDK is $v; update sdkVersion"; exit 1; }
      - name: Publish
        if: env.NODE_AUTH_TOKEN != '' || vars.NPM_TRUSTED_PUBLISHING == 'true'
        env:
          # Provenance attestations need a public source repository.
          PROVENANCE: ${{ github.event.repository.visibility == 'public' && '--provenance' || '' }}
        run: |
          npm install -g npm@latest
          for p in packages/usai packages/create-usai; do
            name=$(node -p "require('./$p/package.json').name")
            version=$(node -p "require('./$p/package.json').version")
            # The first version of a package is published by hand (Trusted
            # Publishing can only be configured on an existing package), and
            # create-usai has its own version cadence.
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already on the registry; skipping"
              continue
            fi
            (cd $p && npm publish --access public $PROVENANCE)
          done
      - name: Publish skipped
        if: env.NODE_AUTH_TOKEN == '' && vars.NPM_TRUSTED_PUBLISHING != 'true'
        run: echo "neither NPM_TOKEN (secret) nor NPM_TRUSTED_PUBLISHING=true (variable) is set; packages were built but not published"

  docker:
    # Both images, one per architecture on a native runner, from the very
    # binary the release tarball carries (the image's usai and the tarball's
    # usai are identical bits; the .sha256 attests both). Pushed by digest;
    # `docker-manifest` joins the architectures.
    if: startsWith(github.ref, 'refs/tags/')
    needs: binaries
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            arch: amd64
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: prebuilt
      - run: chmod +x prebuilt/usai && prebuilt/usai --version && sha256sum prebuilt/usai
      - name: Version matches the tag
        run: |
          v=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "Cargo.toml is $v, tag is ${GITHUB_REF_NAME}"; exit 1; }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Names
        id: names
        run: |
          echo "ghcr=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/usai" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Build and push the runtime image (by digest)
        id: runtime
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/runtime.Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: USAI_VERSION=${{ steps.names.outputs.version }}
          outputs: type=image,name=${{ steps.names.outputs.ghcr }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=runtime-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=runtime-${{ matrix.arch }}
      - name: Build and push the dev image (by digest)
        id: dev
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/dev.Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            USAI_VERSION=${{ steps.names.outputs.version }}
            USAI_RUNTIME_IMAGE=${{ steps.names.outputs.ghcr }}@${{ steps.runtime.outputs.digest }}
          outputs: type=image,name=${{ steps.names.outputs.ghcr }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=dev-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=dev-${{ matrix.arch }}
      - name: Provenance for the images
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.names.outputs.ghcr }}
          subject-digest: ${{ steps.runtime.outputs.digest }}
          push-to-registry: true
      - name: Provenance for the dev image
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.names.outputs.ghcr }}
          subject-digest: ${{ steps.dev.outputs.digest }}
          push-to-registry: true
      - name: Record digests
        run: |
          mkdir -p digests
          echo "${{ steps.runtime.outputs.digest }}" > digests/runtime-${{ matrix.arch }}
          echo "${{ steps.dev.outputs.digest }}" > digests/dev-${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: digests/
          retention-days: 7

  docker-manifest:
    # One multi-arch tag set per image, on GHCR always and on Docker Hub
    # (sakaladev/usai) when DOCKERHUB_USERNAME/DOCKERHUB_TOKEN exist.
    # Tags: X.Y.Z, X.Y, X, latest; X.Y.Z-dev, latest-dev.
    needs: docker
    runs-on: ubuntu-24.04
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    outputs:
      runtime_image: ${{ steps.names.outputs.runtime }}
      dev_image: ${{ steps.names.outputs.dev }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digests-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v3
        if: env.DOCKERHUB_USERNAME != ''
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Image names and tags
        id: names
        run: |
          v=${GITHUB_REF_NAME#v}; major=${v%%.*}; minor=${v%.*}
          ghcr="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/usai"
          images="$ghcr"
          [ -n "$DOCKERHUB_USERNAME" ] && images="sakaladev/usai $ghcr" || echo "DOCKERHUB_USERNAME not set: pushing to GHCR only"
          rt=""; dev=""
          for i in $images; do
            rt="$rt -t $i:$v -t $i:$minor -t $i:$major -t $i:latest"
            dev="$dev -t $i:$v-dev -t $i:latest-dev"
          done
          echo "ghcr=$ghcr" >> "$GITHUB_OUTPUT"
          echo "runtime_tags=$rt" >> "$GITHUB_OUTPUT"
          echo "dev_tags=$dev" >> "$GITHUB_OUTPUT"
          echo "runtime=$ghcr:$v" >> "$GITHUB_OUTPUT"
          echo "dev=$ghcr:$v-dev" >> "$GITHUB_OUTPUT"
      - name: Create the multi-arch manifests
        run: |
          ghcr=${{ steps.names.outputs.ghcr }}
          docker buildx imagetools create ${{ steps.names.outputs.runtime_tags }} \
            "$ghcr@$(cat digests/runtime-amd64)" "$ghcr@$(cat digests/runtime-arm64)"
          docker buildx imagetools create ${{ steps.names.outputs.dev_tags }} \
            "$ghcr@$(cat digests/dev-amd64)" "$ghcr@$(cat digests/dev-arm64)"
          docker buildx imagetools inspect ${{ steps.names.outputs.runtime }}
          docker buildx imagetools inspect ${{ steps.names.outputs.dev }}

  container-smoke:
    # The published images, used the way the scaffold tells a user to:
    # scaffold → app image (dev stage builds, runtime stage serves) →
    # read-only, non-root, no toolchain, 200, SIGTERM drains.
    needs: docker-manifest
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Smoke
        env:
          RUNTIME_IMAGE: ${{ needs.docker-manifest.outputs.runtime_image }}
          DEV_IMAGE: ${{ needs.docker-manifest.outputs.dev_image }}
        run: scripts/container-smoke.sh "$RUNTIME_IMAGE" "$DEV_IMAGE"
