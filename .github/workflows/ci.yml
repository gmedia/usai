name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Incremental artifacts double the target directory and are useless on a
  # fresh runner.
  CARGO_INCREMENTAL: 0

jobs:
  check:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: usai
          POSTGRES_PASSWORD: usai
          POSTGRES_DB: usai
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U usai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      USAI_TEST_DATABASE_URL: postgres://usai:usai@127.0.0.1:5432/usai
    steps:
      # The hosted runner ships ~14 GB free; a wasmtime + QuickJS workspace
      # with clippy --all-targets and the test binaries needs more.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: make setup
      - run: make fmt-check
      - run: make lint
      - run: make test
