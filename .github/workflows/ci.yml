name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Incremental artifacts double the target directory and are useless on a
  # fresh runner.
  CARGO_INCREMENTAL: 0

jobs:
  check:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: usai
          POSTGRES_PASSWORD: usai
          POSTGRES_DB: usai
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U usai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      USAI_TEST_DATABASE_URL: postgres://usai:usai@127.0.0.1:5432/usai
      # examples/todos and examples/invoicing migrate and seed this database
      # in their tests (disjoint tables; the migration ledger tolerates
      # another application's rows).
      DATABASE_URL: postgres://usai:usai@127.0.0.1:5432/usai
    steps:
      # The hosted runner ships ~14 GB free; a wasmtime + QuickJS workspace
      # with clippy --all-targets and the test binaries needs more.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: make setup
      - run: make fmt-check
      - run: make lint
      - name: Previous release binary (upgrade/downgrade matrix)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/previous && cd /tmp/previous
          if gh release download --repo "$GITHUB_REPOSITORY" --pattern 'usai-*-x86_64-unknown-linux-gnu.tar.gz' 2>/dev/null; then
            tar xzf usai-*.tar.gz
            echo "USAI_PREVIOUS_BIN=$(find /tmp/previous -type f -name usai | head -1)" >> "$GITHUB_ENV"
            /tmp/previous/*/usai --version
          else
            echo "no previous release; the matrix test skips"
          fi
      - run: make test

  supply-chain:
    # Known-vulnerable dependencies fail the build; Rust via RustSec, npm via
    # the registry's advisories (production dependencies only).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm audit --prod --audit-level high

  container:
    # The two images build and the scaffold's Docker paths work — before a
    # tag ever ships them. amd64 only here; the release builds both. The
    # buildx container driver cannot see images loaded into the daemon, so
    # the runtime image goes through a throwaway local registry on the way
    # to the dev image and the smoke test.
    runs-on: ubuntu-24.04
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000
    env:
      RUNTIME_IMAGE: localhost:5000/sakaladev/usai:ci
      DEV_IMAGE: localhost:5000/sakaladev/usai:ci-dev
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/runtime.Dockerfile
          push: true
          tags: ${{ env.RUNTIME_IMAGE }}
          build-args: USAI_VERSION=ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build the dev image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/dev.Dockerfile
          push: true
          tags: ${{ env.DEV_IMAGE }}
          build-args: |
            USAI_VERSION=ci
            USAI_RUNTIME_IMAGE=${{ env.RUNTIME_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: scripts/container-smoke.sh "$RUNTIME_IMAGE" "$DEV_IMAGE"
