# A production-shaped deployment of a Usai application image (built from the
# scaffold's Dockerfile): PostgreSQL, a one-shot migration, the runtime with
# its private status listener, and a reverse proxy that terminates TLS and
# never forwards /_usai/*. Adjust names, secrets and the proxy to taste.
#
#   docker compose -f compose.production.yaml build
#   docker compose -f compose.production.yaml run --rm migrate
#   docker compose -f compose.production.yaml up -d
services:
  postgres:
    image: postgres:18
    environment: { POSTGRES_USER: app, POSTGRES_PASSWORD: change-me, POSTGRES_DB: app }
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U app -d app"], interval: 2s, timeout: 2s, retries: 15 }
    volumes: [pgdata:/var/lib/postgresql]
    restart: unless-stopped

  migrate:                      # docker compose run --rm migrate
    build: .
    image: my-app:local
    command: ["db", "migrate", "--artifact", "/app/.usai/build"]
    environment: { DATABASE_URL: "postgres://app:change-me@postgres:5432/app?sslmode=disable" }
    depends_on: { postgres: { condition: service_healthy } }
    read_only: true
    tmpfs: [/tmp]
    profiles: [ops]

  app:
    build: .
    image: my-app:local
    command:
      - run
      - --artifact
      - /app/.usai/build
      - --host
      - 0.0.0.0
      - --port
      - "3000"
      - --status-addr
      - 0.0.0.0:9090          # reachable from the compose network only (not published)
      - --max-worlds
      - "48"                  # ≈ 40 MB base + 48 × 4 MB per touched world slot (+30 MB per held revision); fits the 512 MB limit below
    environment:
      DATABASE_URL: "postgres://app:change-me@postgres:5432/app?sslmode=disable"
      # USAI_REQUIRE_SIGNATURE: <public key hex>   # refuse unsigned/tampered artifacts
      # USAI_STATUS_TOKEN: <random>              # status/metrics/openapi answer 401 without `Authorization: Bearer`; probes stay open
      # USAI_SURFACES_OFF: docs                   # switch off what nobody consumes here (status, metrics, docs, live, ready)
    depends_on: { postgres: { condition: service_healthy } }
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 512m           # measured (docs/measurements/2026-09-20-p8e-efficiency.md): 192m is the supported floor for 48 worlds, 512m keeps a held revision + headroom
    stop_grace_period: 35s    # drain grace (2 s: readiness fails first) + drain bound (30 s) + margin
    restart: unless-stopped
    # Liveness only: "the process answers". Readiness is the proxy's job
    # (`usai probe ready` / GET :9090/_usai/ready) because a draining
    # instance is live and not ready, and compose cannot express that.
    # `start_period` covers the activation (resources open before the
    # listener answers) so a slow start is not counted as a failure, and
    # `retries` is what makes the state change at all — without it compose
    # only labels the container unhealthy and `restart: unless-stopped`
    # never acts on it.
    healthcheck:
      test: ["CMD", "usai", "probe", "live", "--addr", "127.0.0.1:9090"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  caddy:
    image: caddy:2
    ports: ["80:80", "443:443"]
    configs: [{ source: caddyfile, target: /etc/caddy/Caddyfile }]
    volumes: [caddy_data:/data]
    depends_on: [app]
    restart: unless-stopped

configs:
  caddyfile:
    content: |
      example.com {
        # The status listener is on :9090 inside the network; nothing under
        # /_usai/ exists on :3000 without --status, and this denies it anyway.
        @internal path /_usai/*
        respond @internal 404
        reverse_proxy app:3000 {
          health_uri /_usai/ready
          health_port 9090
          # At or below the drain grace (USAI_DRAIN_GRACE, 2 s): the proxy
          # must learn the instance is draining before its listener closes.
          health_interval 1s
          lb_try_duration 5s
          # Readiness reports resource health rather than failing on it
          # (the default since 0.0.10), so a PostgreSQL outage leaves this
          # upstream in rotation and the routes that need the database
          # answer 503 on their own. USAI_READY_REQUIRES_RESOURCES=1 on the
          # app couples them, for a replica that owns its database.
          # docs/runbooks/postgres-down.md has the trade-off.
          # With more than one replica, give each its own address and keep
          # the ports identical — health_port is one value for the whole
          # handler (docs/runbooks/deploy-and-rollback.md).
          #
          # Streams and WebSockets pass through this handler as they are:
          # Caddy forwards an upgrade without configuration, and **no sticky
          # sessions are needed** — a socket world holds nothing, so fan-out
          # goes through a resource and crosses replicas by itself
          # (GUIDE §9). The runtime marks every stream `Cache-Control:
          # no-cache` and `X-Accel-Buffering: no`, which is what a buffering
          # proxy needs to be told.
          #
          # Measured through this block: SSE and WebSockets, in the
          # connection campaign (500 cycles, 40 held connections across a
          # revision replacement, an app restart and a proxy restart). **Not**
          # measured: a stream with a content type other than
          # `text/event-stream` — a CSV export, say. If such a response
          # arrives at the client in one lump rather than as it is written,
          # add `flush_interval -1` to this handler and measure again.
        }
      }

volumes:
  pgdata:
  caddy_data:
